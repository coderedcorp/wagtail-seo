on:
  push:
    branches:
      - main
      - 'release/**'
  pull_request:
    branches:
      - main

jobs:
  unit-tests:
    name: Test py${{ matrix.python }} wag${{ matrix.wagtail }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: "3.11"
            wagtail: "4.1.*"
          - python: "3.11"
            wagtail: "5.2.*"
          - python: "3.12"
            wagtail: "6.3.*"
          - python: "3.13"
            wagtail: "7.*"
          - python: "3.14"
            wagtail: "8.*"
          - python: "3.15"
            wagtail: "8.*"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}

      - name: "CR-QC: Install from local repo"
        run: python -m pip install -r requirements-dev.txt "wagtail==${{ matrix.wagtail }}"

      - name: "CR-QC: Check migrations"
        working-directory: testproject
        run: python manage.py makemigrations --check

      - name: "CR-QC: Run unit tests"
        run: pytest ./testproject/

  lint:
    name: Linters
    needs: unit-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.15"

      - name: "CR-QC: Install from local repo"
        run: python -m pip install -r requirements-dev.txt

      - name: "CR-QC: Spell check"
        run: codespell .

      - name: "CR-QC: Lint"
        run: ruff check .

      - name: "CR-QC: Format check"
        run: ruff format --check .

      - name: "CR-QC: Type check"
        run: mypy ./wagtailseo/

  docs:
    name: Documentation
    needs: unit-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.15"

      - name: "CR-QC: Install from local repo"
        run: python -m pip install -r requirements-dev.txt

      - name: "CR-QC: Build documentation"
        run: sphinx-build -M html ./docs/ ./docs/_build/ -W
